<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="SOCK Guild Wars 2 WvW raid reports">
  <title>SOCK · Murder Archive</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Uncial+Antiqua&family=Cinzel+Decorative:wght@700&display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: dark;
      --ember: #ff5500;
      --ember-glow: rgba(255, 85, 0, 0.35);
      --brass: #d4a359;
      --iron-dark: #121417;
      --iron-plate: #1a1e24;
      --iron-border: #3b424d;
      --text-bright: #f0e6d2;
      --text-muted: #9aa2ad;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background-color: var(--iron-dark);
      color: var(--text-bright);
      font-family: 'Cinzel', serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      position: relative;
      overflow-x: hidden;
    }

    /* Ambient Burning Embers Glow */
    body::before {
      content: '';
      position: absolute;
      top: -10%;
      left: 50%;
      transform: translateX(-50%);
      width: 900px;
      height: 500px;
      background: radial-gradient(ellipse at center, rgba(255, 68, 0, 0.15) 0%, rgba(0,0,0,0) 70%);
      pointer-events: none;
      z-index: -1;
    }

    main {
      width: 100%;
      max-width: 860px;
      padding: 64px 24px;
    }

    /* Charr Warband Iron Banner Header */
    header {
      position: relative;
      background: linear-gradient(180deg, rgba(30, 35, 43, 0.95) 0%, rgba(20, 24, 29, 0.95) 100%);
      border: 2px solid var(--iron-border);
      border-top: 4px solid var(--brass);
      padding: 36px 32px;
      border-radius: 4px;
      margin-bottom: 48px;
      box-shadow: 0 12px 35px rgba(0, 0, 0, 0.7), inset 0 0 20px rgba(0,0,0,0.8);
    }

    /* Iron Rivets at Corners */
    header::before, header::after {
      content: '✦';
      position: absolute;
      color: var(--brass);
      font-size: 10px;
      opacity: 0.6;
    }
    header::before { top: 8px; left: 12px; }
    header::after { top: 8px; right: 12px; }

    .warband-tag {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      font-size: 11px;
      font-weight: 900;
      letter-spacing: 0.22em;
      color: var(--ember);
      text-transform: uppercase;
      margin-bottom: 12px;
      text-shadow: 0 0 8px var(--ember-glow);
    }

    h1 {
      font-family: 'Cinzel Decorative', serif;
      font-size: clamp(34px, 6vw, 56px);
      font-weight: 900;
      line-height: 1.1;
      margin: 0 0 16px 0;
      letter-spacing: 0.02em;
      background: linear-gradient(180deg, #ffffff 10%, #e0bc81 60%, #8a5a27 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 2px 4px rgba(0,0,0,0.8));
    }

    p {
      color: var(--text-muted);
      font-size: 16px;
      line-height: 1.6;
      margin: 0;
      max-width: 58ch;
    }

    .section-title {
      font-family: 'Uncial Antiqua', cursive;
      font-size: 22px;
      color: var(--brass);
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .section-title::after {
      content: '';
      flex: 1;
      height: 2px;
      background: linear-gradient(90deg, var(--iron-border), transparent);
    }

    ul {
      list-style: none;
      padding: 0;
      margin: 0;
    }

    /* Warband Tome / Iron Card */
    .war-card {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      padding: 24px 28px;
      background: var(--iron-plate);
      border: 1px solid var(--iron-border);
      border-left: 5px solid var(--ember);
      border-radius: 4px;
      color: var(--text-bright);
      text-decoration: none;
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      position: relative;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.5);
    }

    .war-card:hover {
      background: rgba(35, 42, 51, 0.9);
      border-color: var(--brass);
      border-left-color: var(--ember);
      box-shadow: 0 8px 30px var(--ember-glow), inset 0 0 15px rgba(255, 85, 0, 0.1);
      transform: translateY(-3px);
    }

    .card-meta {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .card-date {
      font-size: 12px;
      font-weight: 700;
      color: var(--ember);
      letter-spacing: 0.15em;
      text-transform: uppercase;
    }

    .card-title {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: 0.03em;
      color: #ffffff;
    }

    .card-action {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      font-weight: 900;
      color: var(--brass);
      text-transform: uppercase;
      letter-spacing: 0.12em;
      padding: 10px 18px;
      background: rgba(212, 163, 89, 0.08);
      border: 1px solid rgba(212, 163, 89, 0.3);
      transition: all 0.2s ease;
    }

    .war-card:hover .card-action {
      background: var(--brass);
      color: #121417;
      box-shadow: 0 0 12px rgba(212, 163, 89, 0.4);
    }

    footer {
      margin-top: 64px;
      padding-top: 24px;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      color: var(--text-muted);
      font-size: 12px;
      text-align: center;
      letter-spacing: 0.05em;
    }

    @media (max-width: 600px) {
      .war-card {
        flex-direction: column;
        align-items: flex-start;
      }
    }
    li { margin: 16px 0; }
    .card-meta { min-width: 0; overflow-wrap: anywhere; }
    .warband-tag { flex-wrap: wrap; overflow-wrap: anywhere; }
    .war-card:focus-visible { outline: 3px solid var(--brass); outline-offset: 4px; }
    .empty { padding: 24px; border: 1px dashed var(--iron-border); }
    @media(max-width:480px) { main { padding: 32px 16px; } header { padding: 28px 20px; } }
    @media(prefers-reduced-motion:reduce) { .war-card,.card-action { transition: none; } .war-card:hover { transform: none; } }
  </style>
</head>
<body>
  <main>
    <header>
      <div class="warband-tag">🔥 [SOCK] · CULT CHRONICLES · WVW</div>
      <h1>The Murder Archive</h1>
         </header>

    <section aria-labelledby="reports">
      <h2 class="section-title" id="reports">40 Day Archive</h2>
      <ul><li><a class="war-card" href="https://output.rethl.net/20261002/TsySSs" target="_blank" rel="noopener noreferrer" aria-label="2026-10-01 · Graven Light"><div class="card-meta"><span class="card-date">2026-10-01 · Field Log</span><span class="card-title">Graven Light</span></div><span class="card-action">Inspect Tactical Log ↗</span></a></li></ul>
    </section>

    <footer>
      SOCK Murder archive · Unofficial fan project. Guild Wars 2 is a trademark of ArenaNet.
    </footer>
  </main>
</body>
</html>
